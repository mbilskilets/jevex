name: Release

# Manual releases. Bump "version" in package.json and add a CHANGELOG entry in
# a normal PR, merge it, then run this workflow from the Actions tab. It
# verifies that no tag exists for that version yet, builds and tests, publishes
# to npm with provenance, pushes the tag, and creates a GitHub release.
#
# Who can release: the job only runs for the repository owner and uses the
# "npm-release" environment, which requires the owner's approval before any
# secret is exposed or anything is published.
#
# npm auth: if the NPM_TOKEN secret is set on the environment (granular token
# with "bypass 2FA"), it is used. Otherwise Trusted Publishing (OIDC) is
# used: on npmjs.com, package settings -> Trusted Publisher -> GitHub Actions,
# repository mbilskilets/jevex, workflow release.yml, environment npm-release.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == 'mbilskilets' && github.repository == 'mbilskilets/jevex'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists; bump package.json in a PR first"
            exit 1
          fi
          if ! grep -q "$version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run link
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test

      - name: Publish to npm (token)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Publish to npm (trusted publishing)
        if: env.NPM_TOKEN == ''
        run: npm publish --access public --provenance

      - name: Tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
